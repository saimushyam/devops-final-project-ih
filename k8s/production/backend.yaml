apiVersion: v1
kind: Service
metadata:
  name: expensy-backend
  namespace: production
spec:
  selector:
    app: expensy-backend
  ports:
    - port: 8706
      targetPort: 8706
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expensy-backend
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expensy-backend
  template:
    metadata:
      labels:
        app: expensy-backend
    spec:
      containers:
        - name: backend
          image: acrexpensyb8f069a9.azurecr.io/expensy-backend:v1
          ports:
            - containerPort: 8706
          envFrom:
            - configMapRef:
                name: expensy-config
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: expensy-secrets
                  key: database-uri
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: expensy-secrets
                  key: redis-password
          readinessProbe:
            httpGet:
              path: /api/expenses
              port: 8706
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
