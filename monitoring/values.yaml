grafana:
  enabled: true
  service:
    type: ClusterIP
  persistence:
    enabled: false

prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      emptyDir:
        sizeLimit: 2Gi

alertmanager:
  enabled: false
